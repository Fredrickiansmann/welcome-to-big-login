<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logintogod</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <h1 class="centre">
        BIG LOGIN CENTRE
    </h1>
    <form action="authservice.php" method="post">
        <div class="centre">
            <img src="icon.png">
        </div>

        <div class="centre, inputsarea">
            
            <h2>Hello! We need YOU to Login TODAY!</h2>
            
            <p class="topthingy">Please enter your details!</p> 

            <p id="login-error" role="alert" hidden>Hibás felhasználónév vagy jelszó.</p>
            
            <label class="descriptor" for="username" id="username">Your account's username</label>
            
            <input type="text" class="inputtext" placeholder="Enter username" id="username" name="username" required>

            <label class="descriptor" for="password"id="password">Your account's password</label>
            
            <input type="password" class="inputtext" placeholder="Enter password" id="password" name="password" required>
            <button type="submit">
                <h2>Login</h2>
            </button>
        </div>


    </form>
<script src="script.js"></script>
<script>
    if (new URLSearchParams(window.location.search).get('error') === 'invalid') {
        document.getElementById('login-error').hidden = false;
    }
</script>
</body>
</html>
