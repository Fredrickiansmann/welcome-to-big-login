<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logintogod</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <h1 class="centre">
        BIG LOGIN CENTRE
    </h1>
    <fieldset>
        <div class="centre">
            <img src="icon.png">
        </div>

        <div class="centre, inputsarea">
            
            <h2>Hello! We need YOU to Login TODAY!</h2>
            
            <p class="topthingy">Please enter your details!</p> 
            
            <p class="descriptor" id="username">Your account's username</p>
            
            <input type="text" class="inputtext" placeholder="Enter username" id="username">

            <p class="descriptor" id="username">Your account's password</p>
            
            <input type="text" class="inputtext" placeholder="Enter password" id="password">

            <p class="descriptor" id="username">Your account's email</p>
            
            <input type="text" class="inputtext" placeholder="Enter email" id="email">

            <p class="descriptor" id="username">Your home's address</p>
            
            <input type="text" class="inputtext" placeholder="Enter address" id="address">
            <button>
                <h2>Login</h2>
            </button>
        </div>


    </fieldset>
    
</body>
</html>
